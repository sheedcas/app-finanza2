name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generar proyecto Android
        run: |
          flutter create --platforms=android --org cl.personal --project-name finanzas_auto .
          rm -f test/widget_test.dart
      - name: Ajustar Android (permisos, desugaring, nombre)
        run: python3 tool/preparar_android.py
      - run: flutter pub get
      - name: Pruebas del parser (no bloquea)
        run: flutter test
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
